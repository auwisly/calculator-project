<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор с историей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор</h1>
        
        <div class="calculator">
            <input type="number" id="firstNumber" placeholder="Первое число">
            <select id="operation">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
            <input type="number" id="secondNumber" placeholder="Второе число">
            <button id="calculateBtn">Посчитать</button>
        </div>

        <div class="result">
            <h3>Результат:</h3>
            <div id="currentResult">—</div>
        </div>

        <div class="history">
            <h3>История вычислений:</h3>
            <ul id="historyList"></ul>
            <button id="clearHistoryBtn">Очистить историю</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
